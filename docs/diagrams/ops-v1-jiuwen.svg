<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="635" viewBox="0 0 1080 635" role="img" aria-labelledby="jiuwen-title jiuwen-desc">
<title id="jiuwen-title">Process SDK 与 Swarm Core 的真实接线设计</title><desc id="jiuwen-desc">执行服务内的宿主用 SDK 通过管道调用 Swarm 子进程；Core 位于子进程内，驱动模型调用；宿主工具回调通过 HTTP 访问独立工具服务。</desc>
<defs><marker id="jiuwen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#46748b"/></marker></defs>
<rect width="1080" height="635" rx="16" fill="#f7fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#17374a">
<text x="28" y="38" font-size="27" font-weight="700" fill="#17374a">九问执行服务内部｜进程边界比名字更重要</text>
<rect x="22" y="72" width="1036" height="417" rx="16" fill="#edf7f1" stroke="#a1c8b3" stroke-width="2"/>
<rect x="50" y="112" width="330" height="200" rx="12" fill="#fff" stroke="#c7d8e2" stroke-width="1.5"/>
<text x="68" y="145" font-size="23" font-weight="700" fill="#17374a">父进程：我们写的宿主</text>
<text x="68" y="175" font-size="18" font-weight="400" fill="#496576">任务认领 / 调用 Client.run</text>
<text x="68" y="201" font-size="18" font-weight="400" fill="#496576">on_event：记录可展示事件</text>
<text x="68" y="227" font-size="18" font-weight="400" fill="#496576">on_tool_call：派发工具请求</text>
<text x="68" y="253" font-size="18" font-weight="400" fill="#496576">on_interaction：处理问答</text>
<rect x="640" y="112" width="390" height="325" rx="12" fill="#dbefe3" stroke="#8eb99f" stroke-width="1.5"/>
<text x="658" y="145" font-size="23" font-weight="700" fill="#17374a">子进程：官方 Process CLI</text>
<text x="658" y="175" font-size="18" font-weight="400" fill="#496576">jiuwenswarm-process</text>
<text x="658" y="201" font-size="18" font-weight="400" fill="#496576">共享 Swarm Runtime</text>
<text x="658" y="227" font-size="18" font-weight="400" fill="#496576">Agent 配置 / Session / 权限</text>
<rect x="665" y="285" width="340" height="119" rx="12" fill="#fff" stroke="#9ccbb5" stroke-width="1.5"/>
<text x="683" y="318" font-size="23" font-weight="700" fill="#17374a">Core / DeepAgent</text>
<text x="683" y="348" font-size="18" font-weight="400" fill="#496576">真实模型 ↔ 工具循环</text>
<text x="683" y="374" font-size="18" font-weight="400" fill="#496576">不使用脚本生成模型决策</text>
<path d="M380 170H640" fill="none" stroke="#46748b" stroke-width="2" marker-end="url(#jiuwen-arrow)"/>
<text x="415" y="154" font-size="17" font-weight="600" fill="#46748b">SDK → JSONL 输入</text>
<path d="M640 255H380" fill="none" stroke="#46748b" stroke-width="2" marker-end="url(#jiuwen-arrow)"/>
<text x="397" y="242" font-size="17" font-weight="600" fill="#46748b">事件 / 工具请求 / 终态</text>
<text x="52" y="365" font-size="18" font-weight="600" fill="#17374a">SDK 是管道客户端；不在父进程里再造循环。</text>
<text x="52" y="403" font-size="18" font-weight="600" fill="#17374a">终态结果 + 退出码一致，才算执行成功。</text>
<text x="52" y="459" font-size="18" font-weight="400" fill="#496576">一次 run 结束即清理；CI 等待由控制中心持久化管理。</text>
<rect x="50" y="533" width="330" height="78" rx="12" fill="#fff1de" stroke="#e1bf86" stroke-width="1.5"/>
<text x="68" y="566" font-size="22" font-weight="700" fill="#17374a">独立工具 / 工程服务</text>
<rect x="690" y="533" width="340" height="78" rx="12" fill="#f2edff" stroke="#c4b6e8" stroke-width="1.5"/>
<text x="708" y="566" font-size="22" font-weight="700" fill="#17374a">外部真实模型 API</text>
<path d="M50 270H30V510H210V533" fill="none" stroke="#46748b" stroke-width="2" marker-end="url(#jiuwen-arrow)"/>
<text x="65" y="503" font-size="17" font-weight="600" fill="#46748b">HTTP：按权限派发</text>
<path d="M860 437V533" fill="none" stroke="#46748b" stroke-width="2" marker-end="url(#jiuwen-arrow)"/>
<text x="872" y="514" font-size="17" font-weight="600" fill="#46748b">模型协议</text>
</g></svg>
