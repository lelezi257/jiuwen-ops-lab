{
  "name": "jiuwen-ops-lab",
  "services": {
    "control": {
      "image": "jiuwen-ops-runtime:local",
      "build": {
        "context": ".",
        "dockerfile": "deploy/Dockerfile"
      },
      "restart": "unless-stopped",
      "networks": [
        "ops"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "environment": {
        "LAB_DATA": "/data",
        "LAB_AUTO_DELIVER": "${LAB_AUTO_DELIVER:-true}",
        "LAB_REPAIR_LIMIT": "${LAB_REPAIR_LIMIT:-2}"
      },
      "volumes": [
        "control:/data"
      ],
      "command": [
        "python",
        "-m",
        "uvicorn",
        "lab.control:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080"
      ],
      "secrets": [
        "control_token",
        "runner_token"
      ],
      "ports": [
        "127.0.0.1:18780:8080"
      ]
    },
    "evidence": {
      "image": "jiuwen-ops-runtime:local",
      "build": {
        "context": ".",
        "dockerfile": "deploy/Dockerfile"
      },
      "restart": "unless-stopped",
      "networks": [
        "ops"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "environment": {
        "LAB_DATA": "/data"
      },
      "volumes": [
        "evidence:/data"
      ],
      "command": [
        "python",
        "-m",
        "uvicorn",
        "lab.evidence:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080"
      ],
      "secrets": [
        "runner_token",
        "control_token"
      ]
    },
    "delivery": {
      "image": "jiuwen-ops-runtime:local",
      "build": {
        "context": ".",
        "dockerfile": "deploy/Dockerfile"
      },
      "restart": "unless-stopped",
      "networks": [
        "ops",
        "app"
      ],
      "read_only": false,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [],
      "environment": {
        "LAB_DATA": "/data",
        "GITHUB_REPOSITORY": "${GITHUB_REPOSITORY}",
        "GITHUB_BRANCH": "${GITHUB_BRANCH:-lab-live}",
        "LAB_TRUST_SHA": "${LAB_TRUST_SHA}",
        "HOST_REPO": "${HOST_REPO}",
        "HTTP_PROXY": "${HTTP_PROXY:-}",
        "HTTPS_PROXY": "${HTTPS_PROXY:-}",
        "NO_PROXY": "localhost,127.0.0.1,control,probe,order-api"
      },
      "volumes": [
        "delivery:/data",
        "work:/work",
        "/var/run/docker.sock:/var/run/docker.sock"
      ],
      "command": [
        "python",
        "-m",
        "uvicorn",
        "lab.delivery:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080"
      ],
      "secrets": [
        "runner_token",
        "control_token",
        "github_token"
      ]
    },
    "runner": {
      "image": "jiuwen-ops-runner:local",
      "build": {
        "context": ".",
        "dockerfile": "deploy/Runner.Dockerfile"
      },
      "restart": "unless-stopped",
      "networks": [
        "ops"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "environment": {
        "LAB_DATA": "/data"
      },
      "volumes": [
        "runner:/data",
        "./.local/swarm:/config/swarm"
      ],
      "command": [
        "python",
        "-m",
        "uvicorn",
        "lab.runner:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080"
      ],
      "secrets": [
        "runner_token"
      ],
      "env_file": [
        ".local/model.env"
      ]
    },
    "probe": {
      "image": "jiuwen-ops-runtime:local",
      "build": {
        "context": ".",
        "dockerfile": "deploy/Dockerfile"
      },
      "restart": "unless-stopped",
      "networks": [
        "ops",
        "app"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "environment": {
        "LAB_DATA": "/data",
        "LAB_VERIFY_SECONDS": "${LAB_VERIFY_SECONDS:-60}",
        "LAB_VERIFY_WINDOWS": "${LAB_VERIFY_WINDOWS:-2}",
        "LAB_VERIFY_MIN_REQUESTS": "${LAB_VERIFY_MIN_REQUESTS:-30}"
      },
      "volumes": [
        "probe:/data"
      ],
      "command": [
        "python",
        "-m",
        "uvicorn",
        "lab.probe:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080"
      ],
      "secrets": [
        "control_token"
      ]
    },
    "collector": {
      "image": "jiuwen-ops-runtime:local",
      "build": {
        "context": ".",
        "dockerfile": "deploy/Dockerfile"
      },
      "restart": "unless-stopped",
      "networks": [
        "ops"
      ],
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "environment": {
        "LAB_DATA": "/data"
      },
      "volumes": [
        "collector:/data",
        "logs:/logs:ro"
      ],
      "command": [
        "python",
        "-m",
        "lab.collector"
      ]
    },
    "db": {
      "image": "postgres:16.9-alpine",
      "restart": "unless-stopped",
      "networks": [
        "app"
      ],
      "environment": {
        "POSTGRES_USER": "orders",
        "POSTGRES_DB": "orders",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/db_password"
      },
      "secrets": [
        "db_password"
      ],
      "volumes": [
        "postgres:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U orders"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      }
    },
    "order-api": {
      "image": "${ORDER_IMAGE:-jiuwen-order:bootstrap}",
      "build": {
        "context": ".",
        "dockerfile": "deploy/Order.Dockerfile",
        "args": {
          "SOURCE_SHA": "${LAB_TRUST_SHA}"
        }
      },
      "container_name": "ops-order-api",
      "restart": "unless-stopped",
      "read_only": true,
      "tmpfs": [
        "/tmp"
      ],
      "networks": [
        "app"
      ],
      "ports": [
        "127.0.0.1:18080:8080"
      ],
      "secrets": [
        "db_password"
      ],
      "volumes": [
        "logs:/logs"
      ],
      "environment": {
        "RELEASE_ID": "release-baseline",
        "IMAGE_DIGEST": "${ORDER_IMAGE:-bootstrap}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      }
    },
    "prometheus": {
      "image": "prom/prometheus:v3.4.1",
      "restart": "unless-stopped",
      "networks": [
        "ops",
        "app"
      ],
      "volumes": [
        "./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro",
        "./config/alerts.yml:/etc/prometheus/alerts.yml:ro",
        "prometheus:/prometheus"
      ],
      "command": [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=3d"
      ]
    },
    "alertmanager": {
      "image": "prom/alertmanager:v0.28.1",
      "restart": "unless-stopped",
      "networks": [
        "ops"
      ],
      "volumes": [
        "./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      ],
      "secrets": [
        "control_token"
      ]
    },
    "loki": {
      "image": "grafana/loki:3.5.1",
      "restart": "unless-stopped",
      "networks": [
        "ops"
      ],
      "volumes": [
        "./config/loki.yml:/etc/loki/config.yml:ro",
        "loki:/loki"
      ],
      "command": [
        "-config.file=/etc/loki/config.yml"
      ]
    },
    "registry": {
      "image": "registry:2.8.3",
      "restart": "unless-stopped",
      "networks": [
        "ops"
      ],
      "ports": [
        "127.0.0.1:5000:5000"
      ],
      "volumes": [
        "registry:/var/lib/registry"
      ]
    }
  },
  "volumes": {
    "control": {},
    "evidence": {},
    "delivery": {},
    "runner": {},
    "probe": {},
    "collector": {},
    "work": {},
    "postgres": {},
    "logs": {},
    "prometheus": {},
    "loki": {},
    "registry": {}
  },
  "networks": {
    "ops": {},
    "app": {}
  },
  "secrets": {
    "control_token": {
      "file": ".local/secrets/control_token"
    },
    "runner_token": {
      "file": ".local/secrets/runner_token"
    },
    "db_password": {
      "file": ".local/secrets/db_password"
    },
    "github_token": {
      "file": ".local/secrets/github_token"
    }
  }
}
